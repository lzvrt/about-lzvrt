<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>lzvrt</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <div id="overlay">
    <div class="hint">[ click anywhere to continue ]</div>
  </div>

  <canvas id="fx"></canvas>

  <div class="card">
    <div class="name">lzvrt</div>

    <div class="links">
      <a class="btn" href="https://steamcommunity.com/id/lzvrt/" target="_blank">
        <i class="fa-brands fa-steam"></i>
      </a>
      <a class="btn" href="https://t.me/lzvrt0" target="_blank">
        <i class="fa-brands fa-telegram"></i>
      </a>
      <a class="btn" href="https://discordapp.com/users/896078593342451752/" target="_blank">
        <i class="fa-brands fa-discord"></i>
      </a>
    </div>
  </div>

  <div class="player">
    <div class="trackName" id="trackName">track</div>

    <div class="progressWrap">
      <input id="seek" type="range" min="0" max="100" value="0">
      <div class="timeRow">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="playerControls">
      <div class="volWrap">
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.25">
        <span id="volPercent">50%</span>
      </div>

      <div class="rightControls">
        <button id="prev">⏮</button>
        <button id="play">▶</button>
        <button id="next">⏭</button>
      </div>
    </div>
  </div>

  <audio id="audio"></audio>

  <script src="script.js"></script>
</body>
</html>
